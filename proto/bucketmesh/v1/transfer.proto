syntax = "proto3";

package bucketmesh.v1;

option java_package = "tw.com.tymbackend.bucketmesh.v1";
option java_multiple_files = true;

message TransferRequest {
  string idempotency_key = 1;
  string bucket = 2;
  string object_name = 3;
  string direction = 4;
  int64 total_bytes = 5;
}

message TransferStatusResponse {
  string job_id = 1;
  string status = 2;
  string bucket = 3;
  string object_name = 4;
  int64 transferred_bytes = 5;
  string error_code = 6;
  string error_message = 7;
}

message HealthResponse {
  bool ok = 1;
  string service = 2;
  string version = 3;
}

message EventEnvelope {
  string event_name = 1;
  string job_id = 2;
  string object_name = 3;
  string bucket = 4;
  string etag = 5;
  string correlation_id = 6;
}
